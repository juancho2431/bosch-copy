<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Ícono de calentador con llave inglesa</title>
  <desc id="desc">Símbolo de un calentador a gas con una llama y una llave inglesa que representa el servicio técnico.</desc>
  <defs>
    <radialGradient id="bg-gradient" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#071323" />
      <stop offset="70%" stop-color="#02070c" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="stroke-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f9bff" />
      <stop offset="100%" stop-color="#004b8d" />
    </linearGradient>
    <linearGradient id="glow-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b3c" />
      <stop offset="100%" stop-color="#ff2a45" />
    </linearGradient>
    <filter id="blue-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feFlood flood-color="#1f9bff" flood-opacity="0.45" />
      <feComposite in2="blur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="orange-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feFlood flood-color="#ff4f3c" flood-opacity="0.55" />
      <feComposite in2="blur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="240" height="240" fill="url(#bg-gradient)" rx="32" />
  <g filter="url(#blue-glow)" transform="translate(52 32)">
    <rect x="20" y="14" width="96" height="156" rx="22" ry="22" fill="none" stroke="url(#stroke-blue)" stroke-width="8" />
    <rect x="48" y="0" width="40" height="24" rx="10" fill="none" stroke="url(#stroke-blue)" stroke-width="8" />
    <rect x="56" y="150" width="24" height="24" rx="8" fill="none" stroke="url(#stroke-blue)" stroke-width="8" />
    <path d="M92 66c0 18-16 30-32 30s-32-12-32-30c0-16 12-28 32-40 20 12 32 24 32 40z" fill="url(#stroke-blue)" opacity="0.12" />
    <path d="M60 108c-10 0-18-8-18-18 0-11 9-19 18-25 9 6 18 14 18 25 0 10-8 18-18 18z" fill="none" stroke="url(#stroke-blue)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g filter="url(#orange-glow)">
    <path d="M165 150a24 24 0 0 0-9.5-3.2l-9-0.8 4.6-4.6a10 10 0 0 0 0-14.2l-6.4-6.4-31.1 31.1 6.4 6.4a10 10 0 0 0 14.2 0l4.4-4.4 0.9 8.8a24 24 0 0 0 3.2 9.5l10.8 19.8a8 8 0 0 0 11 3 8 8 0 0 0 3-3l11.6-21.4a24 24 0 0 0-3-27.8z" fill="url(#glow-orange)" />
  </g>
</svg>
